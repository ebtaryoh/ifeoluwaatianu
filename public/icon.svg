<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&amp;display=swap');
    text {
      font-family: 'Playfair Display', serif;
      font-size: 200px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .amp {
      fill: #ad8b5c;
      font-style: italic;
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #fcfaf7; }
      .txt { fill: #2d2925; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2d2925; }
      .txt { fill: #fcfaf7; }
    }
  </style>
  <rect class="bg" width="512" height="512" rx="112" />
  <text x="50%" y="54%" class="txt">
    O <tspan class="amp">&amp;</tspan> I
  </text>
</svg>